services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: bookkeeping
      POSTGRES_USER: bookkeeping
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookkeeping -d bookkeeping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  reset-db:
    build:
      context: .
      target: db-init
    environment:
      DATABASE_URL: postgresql://bookkeeping:${POSTGRES_PASSWORD}@postgres:5432/bookkeeping
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  agent:
    build:
      context: .
      target: agent
    environment:
      PORT: 3583
      NODE_ENV: production
      DATABASE_URL: postgresql://bookkeeping:${POSTGRES_PASSWORD}@postgres:5432/bookkeeping
      CORS_ORIGIN: ${CORS_ORIGIN}
      AGENT_MODEL: ${AGENT_MODEL}
      AGENT_OBSERVABILITY: ${AGENT_OBSERVABILITY:-off}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      reset-db:
        condition: service_completed_successfully
    expose:
      - "3583"
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    environment:
      PORT: 3000
      NODE_ENV: production
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      DATABASE_URL: postgresql://bookkeeping:${POSTGRES_PASSWORD}@postgres:5432/bookkeeping
      CORS_ORIGIN: ${CORS_ORIGIN}
      FLUE_BASE_URL: http://agent:3583
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_started
    expose:
      - "3000"
    restart: unless-stopped

volumes:
  postgres_data:
